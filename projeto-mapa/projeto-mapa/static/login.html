<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Mapa de Computadores</title>
<style>:root{--bg:#F5F4F4;--card:#fff;--ink:#2E2323;--line:#D8D3D3;--acc:#A94F4F}
@media (prefers-color-scheme:dark){:root{--bg:#1E1A1A;--card:#2A2424;--ink:#F1E9E9;--line:#4A4040;--acc:#B96A6A}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;padding:16px}
.b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:320px}
h1{font-size:18px;margin:0 0 14px}input,button{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:10px}
button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}#e{color:#c0392b;font-size:13px;min-height:18px}</style></head>
<body><div class="b"><h1>Mapa de Computadores</h1>
<input id="u" placeholder="Usuário" autocomplete="username"><input id="p" type="password" placeholder="Senha" autocomplete="current-password">
<div id="e"></div><button id="go">Entrar</button></div>
<script>
async function go(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});
if(r.ok){location.href='/'}else{const d=await r.json().catch(()=>({}));e.textContent=d.error||'Erro ao entrar.'}}
go_=document.getElementById('go');go_.onclick=go;p.addEventListener('keydown',x=>{if(x.key==='Enter')go()});
</script></body></html>
